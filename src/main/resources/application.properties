spring.application.name=omnicore
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/omnicore
spring.datasource.username=omnicore_app
spring.datasource.password=omnicore_app
#spring.datasource.username=root
#spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP connection pool configuration
spring.datasource.hikari.pool-name=OmnicoreHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.open-in-view=false
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG